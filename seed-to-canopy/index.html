<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#081912">
  <meta name="description" content="A small interactive visual story: from seed to canopy.">
  <title>From Seed to Canopy</title>
  <link rel="preload" as="image" href="assets/cover.jpg">
  <style>
    :root { color-scheme: dark; --cream: #f9edd2; --amber: #e5ad63; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #081912; }
    body { font-family: Georgia, 'Times New Roman', serif; }
    .story { position: relative; width: 100%; height: 100%; height: 100dvh; overflow: hidden; cursor: pointer; isolation: isolate; outline: none; }
    .story:focus-visible { outline: 3px solid var(--amber); outline-offset: -7px; }
    .scene { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity 850ms ease, visibility 850ms; background: #081912; }
    .scene.active { opacity: 1; visibility: visible; z-index: 1; }
    .image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center center; transform: scale(1.045); transition: transform 8s ease-out; user-select: none; -webkit-user-drag: none; }
    .scene.active .image { transform: scale(1); }
    .cover .image { object-position: left center; }
    .scene:not(.cover)::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(2,18,12,.52) 0%, rgba(2,18,12,.13) 39%, transparent 66%), linear-gradient(0deg, rgba(2,18,12,.27), transparent 22%); pointer-events: none; }
    .caption { position: absolute; z-index: 2; top: clamp(42px, 10vh, 120px); left: clamp(30px, 7vw, 126px); color: var(--cream); font-size: clamp(52px, 8vw, 130px); font-weight: 400; letter-spacing: -.055em; line-height: .94; margin: 0; opacity: 0; transform: translateY(20px); transition: opacity 650ms ease 320ms, transform 750ms ease 320ms; text-shadow: 0 3px 35px rgba(0,0,0,.2); }
    .scene.active .caption { opacity: 1; transform: translateY(0); }
    .accent { color: var(--amber); display: block; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 700px) {
      .image { object-position: 64% center; }
      .cover .image { object-fit: contain; object-position: 50% center; }
      .caption { top: 10vh; left: 7vw; font-size: clamp(48px, 12vw, 76px); max-width: 80%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .scene, .image, .caption { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main id="story" class="story" role="button" tabindex="0" aria-label="Visual story. Click or press Space to advance; press R to restart from the cover.">
    <section class="scene cover active" aria-hidden="false"><img class="image" src="assets/cover.jpg" alt="A sprout glows in the soil beneath a towering tree" fetchpriority="high"></section>
    <section class="scene" aria-hidden="true"><img class="image" src="assets/seed.jpg" alt="A textured seed held in warm soil"><h1 class="caption">The <span class="accent">Seed</span></h1></section>
    <section class="scene" aria-hidden="true"><img class="image" src="assets/sprout.jpg" alt="A new sprout pushes through the soil"><h1 class="caption">First <span class="accent">Light</span></h1></section>
    <section class="scene" aria-hidden="true"><img class="image" src="assets/canopy.jpg" alt="A mature tree rises into a glowing canopy"><h1 class="caption">The <span class="accent">Canopy</span></h1></section>
  </main>
  <span id="announcement" class="visually-hidden" role="status" aria-live="polite">Cover</span>
  <script>
    (() => {
      const story = document.getElementById('story');
      const scenes = [...story.querySelectorAll('.scene')];
      const announcement = document.getElementById('announcement');
      const names = ['Cover', 'The Seed', 'First Light', 'The Canopy'];
      let current = 0;
      function show(index) {
        current = (index + scenes.length) % scenes.length;
        scenes.forEach((scene, i) => {
          const active = i === current;
          scene.classList.toggle('active', active);
          scene.setAttribute('aria-hidden', String(!active));
          scene.querySelectorAll('img').forEach(img => { img.loading = active ? 'eager' : 'lazy'; });
        });
        announcement.textContent = names[current];
      }
      story.addEventListener('click', () => show(current + 1));
      document.addEventListener('keydown', e => {
        if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowRight') { e.preventDefault(); show(current + 1); }
        else if (e.code === 'KeyR' || e.code === 'Home') { e.preventDefault(); show(0); }
        else if (e.code === 'ArrowLeft' || e.code === 'Backspace') { e.preventDefault(); show(current - 1); }
      });
    })();
  </script>
</body>
</html>
