<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who Gets Paid When the Customer Is an Agent?</title>
<meta name="description" content="Interactive visual story: agent payments and where value moves.">
<link rel="preload" href="fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/intertight.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='3' width='20' height='26' rx='2' fill='%23F2ECE1' stroke='%231C2432' stroke-width='2'/%3E%3Cpath d='M10 10h12M10 15h12M10 20h7' stroke='%23B8652A' stroke-width='2'/%3E%3C/svg%3E">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .36  0 0 0 0 .31  0 0 0 0 .24  0 0 0 .07 0"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1C2432" flood-opacity=".14"/></filter>
    <linearGradient id="cardInk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2C364A"/><stop offset="1" stop-color="#141A26"/></linearGradient>
  </defs>
</svg>
<main id="app" aria-live="polite">
  <div id="stage" class="stage"></div>
</main>
<div id="rotate-hint" role="region" aria-label="Viewing tip">
  <p>Tap the receipt to start: the story opens sideways. A larger screen reads best.</p>
  <button type="button" id="rotate-btn">Rotated view</button>
  <button type="button" id="hint-close" aria-label="Dismiss tip">✕</button>
</div>
<button type="button" id="unrotate" aria-label="Exit rotated view and return to the cover">Exit</button>
<button type="button" id="rotate-mini" aria-label="Open rotated view"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="8" y="3" width="10" height="17" rx="2" fill="none" stroke="#FBF8F1" stroke-width="2"/><path d="M4 22 Q13 27 22 22" fill="none" stroke="#D9924F" stroke-width="2"/><path d="M19 19 L22 22 L19 25" fill="none" stroke="#D9924F" stroke-width="2"/></svg></button>
<div id="narrow-note" role="note">Designed for a desktop or landscape screen.<br>On this screen the story shrinks to fit; rotate or open on a computer for legible text.</div>
<script src="scenes.js"></script>
<script src="app.js"></script>
</body>
</html>
